# Fallback: if Lampwerk.xcodeproj ever gets into a bad state, regenerate it with
#   brew install xcodegen && xcodegen
name: Lampwerk
options:
  bundleIdPrefix: app.lampwerk
  deploymentTarget:
    iOS: "17.0"
targets:
  Lampwerk:
    type: application
    platform: iOS
    sources: [Lampwerk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lampwerk.ios
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Lampwerk
        INFOPLIST_KEY_NSCameraUsageDescription: "Lampwerk uses the camera to tag where lamps stand on set."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
