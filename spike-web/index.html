<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lampwerk Sync Spike</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>Private spike</h1>
<p class="q">Signs in with Apple ID, reads Plots / spike-plot (the plot JSON), renames the plot, saves it.</p>
<div id="apple-sign-in-button"></div><div id="apple-sign-out-button"></div>
<p>lamps: <span id="lamps">-</span><br>modified: <span id="mod">-</span></p>
<p><input id="name" placeholder="plot name"></p>
<p><button id="read">Read</button> <button id="save">Save rename</button></p>
<pre id="log"></pre>
<p class="q"><a href="public.html">public live link test</a></p>
</main>
<script src="token.js"></script>
<script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
<script src="spike.js"></script>
<script>
const zoneID = { zoneName: 'Plots' };
let record = null, plot = null;
const db = () => container.privateCloudDatabase;
async function read() {
  const r = await db().fetchRecords([{ recordName: 'spike-plot', zoneID }]);
  if (r.hasErrors) return say('read error: ' + JSON.stringify(r.errors[0]));
  record = r.records[0];
  plot = JSON.parse(record.fields.json.value);
  $('name').value = plot.name;
  $('lamps').textContent = plot.items.length;
  $('mod').textContent = new Date(record.fields.modifiedAt?.value ?? record.modified.timestamp).toLocaleTimeString();
  say('read ok, tag ' + record.recordChangeTag);
}
async function save() {
  if (!plot) return say('read first');
  plot.name = $('name').value;
  plot.updated = Date.now() / 1000 - 978307200; // Swift's Date encoding: seconds since 2001
  const r = await db().saveRecords([{
    recordType: 'Plot', recordName: 'spike-plot', zoneID, recordChangeTag: record.recordChangeTag,
    fields: { json: { value: JSON.stringify(plot) }, name: { value: plot.name }, modifiedAt: { value: Date.now() } }
  }]);
  if (r.hasErrors) return say('save error: ' + JSON.stringify(r.errors[0]));
  record = r.records[0];
  say('saved, tag ' + record.recordChangeTag + '. Tap Read back on the phone.');
}
$('read').onclick = () => read().catch(e => say('read threw: ' + e));
$('save').onclick = () => save().catch(e => say('save threw: ' + e));
container.setUpAuth().then(user => {
  if (user) { say('signed in'); read().catch(e => say('read threw: ' + e)); }
  else { say('not signed in'); container.whenUserSignsIn().then(() => location.reload()); }
}).catch(e => say('setUpAuth error: ' + (e.ckErrorCode || '') + ' ' + (e.reason || e)));
</script>
</body></html>
