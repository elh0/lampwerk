<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lampwerk Live Link Spike</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>Live link spike</h1>
<p class="q">Reads public.html#&lt;id&gt; from the public database. No sign-in.</p>
<p>id: <span id="id">-</span><br>plot: <span id="name">-</span><br>lamps: <span id="lamps">-</span><br>expires: <span id="exp">-</span></p>
<pre id="log"></pre>
</main>
<script src="token.js"></script>
<script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
<script src="spike.js"></script>
<script>
async function load() {
  const id = location.hash.slice(1);
  $('id').textContent = id || '(add #id to the url)';
  if (!id) return;
  const r = await container.publicCloudDatabase.fetchRecords([id]);
  if (r.hasErrors) return say('read error: ' + JSON.stringify(r.errors[0]));
  const f = r.records[0].fields, plot = JSON.parse(f.json.value);
  $('name').textContent = plot.name; $('lamps').textContent = plot.items.length;
  $('exp').textContent = f.expiresAt ? new Date(f.expiresAt.value).toDateString() : '-';
  say('public read ok, no sign-in');
}
window.onhashchange = load;
load().catch(e => say('threw: ' + (e.ckErrorCode || '') + ' ' + (e.reason || e)));
</script>
</body></html>
